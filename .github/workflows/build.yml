name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      compatibility:
        description: Compatibility suite
        type: choice
        options:
          - smoke
          - release
          - full
          - none
        default: smoke

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan-compatibility:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run-client: ${{ steps.plan.outputs.run-client }}
      run-server: ${{ steps.plan.outputs.run-server }}
      fabric: ${{ steps.plan.outputs.fabric }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select compatibility checks
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_MODE: ${{ inputs.compatibility }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          : > "$changed_files"
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > "$changed_files"
          fi
          ruby scripts/ci-compatibility-plan.rb \
            compatibility.json "$EVENT_NAME" "$HEAD_REF" "$INPUT_MODE" "$changed_files" \
            > "$RUNNER_TEMP/compatibility-plan.json"
          jq -r '"mode=\(.mode)", "run-client=\(."run-client")", "run-server=\(."run-server")",
            "fabric=\(.fabric | tojson)", "server=\(.server | tojson)"' \
            "$RUNNER_TEMP/compatibility-plan.json" >> "$GITHUB_OUTPUT"
          jq -r '"Compatibility mode: `\(.mode)`", "",
            "Fabric runtime checks: \(.fabric | length)",
            "Paper/Folia runtime checks: \(.server | length)"' \
            "$RUNNER_TEMP/compatibility-plan.json" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.bundle.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate generated compatibility documentation
        run: ruby scripts/update-compatibility-docs.rb --check

      - name: Test workflow helpers
        shell: bash
        run: |
          set -euo pipefail
          for test in test/scripts/*_test.rb; do
            ruby "$test"
          done
          python3 -m unittest discover -s test/scripts -p 'test_*.py'

      - name: Validate Modrinth description
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/render-modrinth-description.rb > "$RUNNER_TEMP/modrinth-description.md"
          test -s "$RUNNER_TEMP/modrinth-description.md"

      - name: Build, test, and stage release artifacts
        run: ./gradlew --no-daemon clean build stageReleaseArtifacts --warning-mode all

      - name: Record artifact name
        id: bundle
        env:
          ARTIFACT_NAME: svc-better-groups-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload staged release jars
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: build/release/*.jar
          if-no-files-found: error
          retention-days: 14

  client-compatibility:
    needs: [build, plan-compatibility]
    if: ${{ needs.plan-compatibility.outputs.run-client == 'true' }}
    uses: ./.github/workflows/voicechat-compat.yml
    with:
      matrix: ${{ needs.plan-compatibility.outputs.fabric }}
      clients-artifact: ${{ needs.build.outputs.artifact-name }}

  server-compatibility:
    needs: [build, plan-compatibility]
    if: ${{ needs.plan-compatibility.outputs.run-server == 'true' }}
    uses: ./.github/workflows/server-compat.yml
    with:
      matrix: ${{ needs.plan-compatibility.outputs.server }}
      suite: ${{ needs.plan-compatibility.outputs.mode }}
      plugin-artifact: ${{ needs.build.outputs.artifact-name }}

  compatibility-gate:
    name: Compatibility gate
    if: always()
    needs: [build, plan-compatibility, client-compatibility, server-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected compatibility checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLAN_RESULT: ${{ needs.plan-compatibility.result }}
          RUN_CLIENT: ${{ needs.plan-compatibility.outputs.run-client }}
          RUN_SERVER: ${{ needs.plan-compatibility.outputs.run-server }}
          CLIENT_RESULT: ${{ needs.client-compatibility.result }}
          SERVER_RESULT: ${{ needs.server-compatibility.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$PLAN_RESULT" = success
          check_result() {
            local selected="$1" actual="$2" label="$3"
            local expected=skipped
            case "$selected" in
              true) expected=success ;;
              false) ;;
              *) echo "Invalid $label selection: $selected" >&2; return 1 ;;
            esac
            if [ "$actual" != "$expected" ]; then
              echo "$label: expected $expected, got $actual" >&2
              return 1
            fi
          }
          check_result "$RUN_CLIENT" "$CLIENT_RESULT" Fabric
          check_result "$RUN_SERVER" "$SERVER_RESULT" Paper/Folia
