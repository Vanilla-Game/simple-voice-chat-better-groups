name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew --no-daemon clean build --warning-mode all

      - name: Upload server and client jars
        uses: actions/upload-artifact@v6
        with:
          name: voicechat-group-tools-${{ github.sha }}
          path: |
            build/libs/*.jar
            client-fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  read-compatibility:
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.read.outputs.tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read tested Simple Voice Chat versions
        id: read
        run: |
          tested=$(grep '^voicechat\.tested=' compatibility.properties | cut -d= -f2- \
            | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  # Guards our own changes: every PR re-checks the client against every
  # Simple Voice Chat version the mod currently claims to support.
  client-compatibility:
    needs: read-compatibility
    uses: ./.github/workflows/voicechat-compat.yml
    with:
      versions: ${{ needs.read-compatibility.outputs.tested }}
