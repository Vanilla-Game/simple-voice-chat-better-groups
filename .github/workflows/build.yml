name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew --no-daemon clean build --warning-mode all

      - name: Upload plugin jar
        uses: actions/upload-artifact@v6
        with:
          name: voicechat-group-tools-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
