name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_version:
        description: Existing release version to recover (without the v prefix)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the release PR
        if: ${{ inputs.recover_version == '' }}
        uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Update generated download tables in the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          release_branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          ruby scripts/update-compatibility-docs.rb
          if git diff --quiet -- README.md; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update release download tables'
          git push origin "HEAD:$release_branch"

      - name: Resolve release context
        id: release_context
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RECOVER_VERSION: ${{ inputs.recover_version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CREATED" == 'true' ]]; then
            version="$RELEASE_VERSION"
            tag="$RELEASE_TAG"
          elif [[ -n "$RECOVER_VERSION" ]]; then
            version="$RECOVER_VERSION"
            tag="v$RECOVER_VERSION"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release view "$tag" --json tagName --jq .tagName >/dev/null
          {
            echo 'active=true'
            echo "version=$version"
            echo "tag_name=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.release_context.outputs.active == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_context.outputs.tag_name }}

      - name: Set up JDKs 21 and 25
        if: ${{ steps.release_context.outputs.active == 'true' }}
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Set up Gradle
        if: ${{ steps.release_context.outputs.active == 'true' }}
        uses: gradle/actions/setup-gradle@v5

      - name: Validate generated compatibility documentation
        if: ${{ steps.release_context.outputs.active == 'true' }}
        run: ruby scripts/update-compatibility-docs.rb --check

      - name: Build, test, and stage release artifacts
        if: ${{ steps.release_context.outputs.active == 'true' }}
        run: ./gradlew --no-daemon clean build stageReleaseArtifacts --warning-mode all

      - name: Attach the four jars to the GitHub release
        if: ${{ steps.release_context.outputs.active == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_context.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/release/*.jar --clobber

      - name: Fetch release notes
        if: ${{ steps.release_context.outputs.active == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_context.outputs.tag_name }}
        run: gh release view "$RELEASE_TAG" --json body -q .body > changelog.md

      - name: Prepare Modrinth versions
        if: ${{ steps.release_context.outputs.active == 'true' }}
        id: modrinth
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_context.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          paper_games=$(jq -r '[.server.targets[].minecraft] | unique[]' compatibility.json)
          fabric_1_21_11_games=$(jq -r '.fabric.targets[] | select(.id == "1.21.11") | .releaseMinecraftVersions[]' compatibility.json)
          fabric_26_1_games=$(jq -r '.fabric.targets[] | select(.id == "26.1") | .releaseMinecraftVersions[]' compatibility.json)
          fabric_26_2_games=$(jq -r '.fabric.targets[] | select(.id == "26.2") | .releaseMinecraftVersions[]' compatibility.json)
          curl -fsSL \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: Vanilla-Game/simple-voice-chat-better-groups release workflow' \
            'https://api.modrinth.com/v2/project/scOrYDTf/version' > modrinth-versions.json
          output_lines=()
          for kind in paper fabric_1_21_11 fabric_26_1 fabric_26_2; do
            case "$kind" in
              paper) version="paper-${RELEASE_VERSION}+26.1.2" ;;
              fabric_1_21_11) version="fabric-${RELEASE_VERSION}+1.21.11" ;;
              fabric_26_1) version="fabric-${RELEASE_VERSION}+26.1" ;;
              fabric_26_2) version="fabric-${RELEASE_VERSION}+26.2" ;;
            esac
            publish=true
            if jq -e --arg version "$version" 'any(.[]; .version_number == $version)' modrinth-versions.json >/dev/null; then
              publish=false
              echo "Modrinth version $version already exists; publication will be skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
            output_lines+=("${kind}_publish=$publish" "${kind}_version=$version")
          done
          {
            printf '%s\n' "${output_lines[@]}"
            echo 'paper_games<<EOF_PAPER_GAMES'
            echo "$paper_games"
            echo 'EOF_PAPER_GAMES'
            echo 'fabric_1_21_11_games<<EOF_FABRIC_1_21_11_GAMES'
            echo "$fabric_1_21_11_games"
            echo 'EOF_FABRIC_1_21_11_GAMES'
            echo 'fabric_26_1_games<<EOF_FABRIC_26_1_GAMES'
            echo "$fabric_26_1_games"
            echo 'EOF_FABRIC_26_1_GAMES'
            echo 'fabric_26_2_games<<EOF_FABRIC_26_2_GAMES'
            echo "$fabric_26_2_games"
            echo 'EOF_FABRIC_26_2_GAMES'
          } > "$GITHUB_OUTPUT"

      - name: Publish server plugin to Modrinth
        if: ${{ steps.release_context.outputs.active == 'true' && steps.modrinth.outputs.paper_publish == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: scOrYDTf
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/svc-better-groups-${{ steps.release_context.outputs.version }}.jar
          name: "[PAPER][26.1.2-26.2] Simple Voice Chat Better Groups ${{ steps.release_context.outputs.version }}"
          version: ${{ steps.modrinth.outputs.paper_version }}
          version-type: release
          loaders: |
            paper
            purpur
          game-versions: ${{ steps.modrinth.outputs.paper_games }}
          dependencies: simple-voice-chat(required)
          changelog-file: changelog.md

      - name: Publish Fabric 1.21.11 client to Modrinth
        if: ${{ steps.release_context.outputs.active == 'true' && steps.modrinth.outputs.fabric_1_21_11_publish == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: scOrYDTf
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/svc-better-groups-fabric-1.21.11-${{ steps.release_context.outputs.version }}.jar
          name: "[FABRIC][1.21.11] Simple Voice Chat Better Groups ${{ steps.release_context.outputs.version }}"
          version: ${{ steps.modrinth.outputs.fabric_1_21_11_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.modrinth.outputs.fabric_1_21_11_games }}
          dependencies: |
            simple-voice-chat(required)
            fabric-api(required)
          changelog-file: changelog.md

      - name: Publish Fabric 26.1 client to Modrinth
        if: ${{ steps.release_context.outputs.active == 'true' && steps.modrinth.outputs.fabric_26_1_publish == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: scOrYDTf
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/svc-better-groups-fabric-26.1-${{ steps.release_context.outputs.version }}.jar
          name: "[FABRIC][26.1.x] Simple Voice Chat Better Groups ${{ steps.release_context.outputs.version }}"
          version: ${{ steps.modrinth.outputs.fabric_26_1_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.modrinth.outputs.fabric_26_1_games }}
          dependencies: |
            simple-voice-chat(required)
            fabric-api(required)
          changelog-file: changelog.md

      - name: Publish Fabric 26.2 client to Modrinth
        if: ${{ steps.release_context.outputs.active == 'true' && steps.modrinth.outputs.fabric_26_2_publish == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: scOrYDTf
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/release/svc-better-groups-fabric-26.2-${{ steps.release_context.outputs.version }}.jar
          name: "[FABRIC][26.2] Simple Voice Chat Better Groups ${{ steps.release_context.outputs.version }}"
          version: ${{ steps.modrinth.outputs.fabric_26_2_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.modrinth.outputs.fabric_26_2_games }}
          dependencies: |
            simple-voice-chat(required)
            fabric-api(required)
          changelog-file: changelog.md

      - name: Reconcile featured Modrinth versions
        if: ${{ steps.release_context.outputs.active == 'true' }}
        shell: bash
        env:
          FABRIC_1_21_11_VERSION: ${{ steps.modrinth.outputs.fabric_1_21_11_version }}
          FABRIC_26_1_VERSION: ${{ steps.modrinth.outputs.fabric_26_1_version }}
          FABRIC_26_2_VERSION: ${{ steps.modrinth.outputs.fabric_26_2_version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PAPER_VERSION: ${{ steps.modrinth.outputs.paper_version }}
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header 'User-Agent: Vanilla-Game/simple-voice-chat-better-groups release recovery' \
            'https://api.modrinth.com/v2/project/scOrYDTf/version' \
            > modrinth-versions-after.json

          ruby scripts/modrinth-featured-versions.rb \
            modrinth-versions-after.json \
            "$PAPER_VERSION" \
            "$FABRIC_1_21_11_VERSION" \
            "$FABRIC_26_1_VERSION" \
            "$FABRIC_26_2_VERSION" \
            > modrinth-unfeature-ids.txt
          mapfile -t unfeature_ids < modrinth-unfeature-ids.txt

          for version_id in "${unfeature_ids[@]}"; do
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request PATCH \
              --header "Authorization: $MODRINTH_TOKEN" \
              --header 'Content-Type: application/json' \
              --header 'User-Agent: Vanilla-Game/simple-voice-chat-better-groups release recovery' \
              --data '{"featured":false}' \
              "https://api.modrinth.com/v2/version/$version_id"
          done

          echo "Verified all four Modrinth versions; unfeatured ${#unfeature_ids[@]} superseded version(s)." \
            >> "$GITHUB_STEP_SUMMARY"
