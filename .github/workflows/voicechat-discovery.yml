name: Voice Chat Version Discovery

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: voicechat-version-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      fabric-matrix: ${{ steps.find.outputs.fabric-matrix }}
      server-matrix: ${{ steps.find.outputs.server-matrix }}
      fabric-candidates: ${{ steps.find.outputs.fabric-candidates }}
      server-candidates: ${{ steps.find.outputs.server-candidates }}
      has-fabric: ${{ steps.find.outputs.has-fabric }}
      has-server: ${{ steps.find.outputs.has-server }}
      has-any: ${{ steps.find.outputs.has-any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find untested listed releases
        id: find
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H 'User-Agent: Vanilla-Game/simple-voice-chat-better-groups discovery workflow' \
            'https://api.modrinth.com/v2/project/simple-voice-chat/version' > versions.json

          ruby scripts/voicechat-version-discovery.rb \
            compatibility.json versions.json > discovery.json

          {
            for key in \
              fabric-matrix server-matrix \
              fabric-candidates server-candidates \
              has-fabric has-server has-any; do
              echo "$key=$(jq -c --arg key "$key" '.[$key]' discovery.json)"
            done
          } >> "$GITHUB_OUTPUT"
          echo "Fabric candidates: \`$(jq -c '.["fabric-candidates"]' discovery.json)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Bukkit candidates: \`$(jq -c '.["server-candidates"]' discovery.json)\`" >> "$GITHUB_STEP_SUMMARY"

  check-fabric:
    needs: discover
    if: needs.discover.outputs.has-fabric == 'true'
    uses: ./.github/workflows/voicechat-compat.yml
    with:
      matrix: ${{ needs.discover.outputs.fabric-matrix }}
      probe: true

  check-server:
    needs: discover
    if: needs.discover.outputs.has-server == 'true'
    uses: ./.github/workflows/server-compat.yml
    with:
      matrix: ${{ needs.discover.outputs.server-matrix }}
      suite: discovery

  propose:
    needs: [discover, check-fabric, check-server]
    if: ${{ always() && needs.discover.outputs.has-any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download compatibility results
        uses: actions/download-artifact@v7
        with:
          pattern: compat-result-*
          merge-multiple: true
          path: compat-results

      - name: Apply independent contiguous green prefixes
        id: widen
        shell: bash
        env:
          FABRIC_CANDIDATES: ${{ needs.discover.outputs.fabric-candidates }}
          SERVER_CANDIDATES: ${{ needs.discover.outputs.server-candidates }}
        run: |
          set -euo pipefail
          printf '%s\n' "$FABRIC_CANDIDATES" > fabric-candidates.json
          printf '%s\n' "$SERVER_CANDIDATES" > server-candidates.json
          ruby scripts/apply-voicechat-compatibility-results.rb \
            compatibility.json fabric-candidates.json server-candidates.json compat-results \
            > compatibility-update.json

          jq -r '.messages[]' compatibility-update.json >> "$GITHUB_STEP_SUMMARY"
          updated=$(jq -r '.updated' compatibility-update.json)
          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          if [ "$updated" = true ]; then
            summary=$(jq -r '.summary' compatibility-update.json)
            echo "summary=$summary" >> "$GITHUB_OUTPUT"
            echo "Proposed: $summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No contiguous green prefix was found.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update generated compatibility documentation
        if: steps.widen.outputs.updated == 'true'
        run: ruby scripts/update-compatibility-docs.rb

      - name: Create or update draft PR
        if: steps.widen.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            compatibility.json
            README.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'fix: widen Simple Voice Chat compatibility'
          branch: ci/voicechat-compat-bump
          base: main
          draft: true
          title: 'fix: widen Simple Voice Chat compatibility'
          body: |
            Automated compatibility update from the Voice Chat discovery workflow.

            Each added listed release passed its target's runtime harness. Fabric
            candidates were tested with a non-publishable metadata probe; normal
            PR CI will rebuild and verify the real release jars before merge.

            New Minecraft lines and new Simple Voice Chat minor lines are never
            added automatically. Close and reopen this PR to trigger normal PR CI.

            Changes: ${{ steps.widen.outputs.summary }}
