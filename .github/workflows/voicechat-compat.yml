name: Fabric Voice Chat Compatibility

# Every matrix leg runs the already packaged release jar. Discovery is the
# only caller allowed to request a probe jar whose voicechat metadata is '*'.
on:
  workflow_call:
    inputs:
      matrix:
        description: JSON array of individual Fabric compatibility checks
        required: true
        type: string
      probe:
        description: Use the non-publishable probe jar for not-yet-declared SVC releases
        required: false
        default: false
        type: boolean
      clients-artifact:
        description: Existing workflow artifact containing the packaged release clients
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ inputs.probe || inputs.clients-artifact == '' }}
        uses: actions/checkout@v7

      - name: Set up JDKs 21 and 25
        if: ${{ inputs.probe || inputs.clients-artifact == '' }}
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Set up Gradle
        if: ${{ inputs.probe || inputs.clients-artifact == '' }}
        uses: gradle/actions/setup-gradle@v5

      - name: Package release jars
        if: ${{ !inputs.probe && inputs.clients-artifact == '' }}
        run: ./gradlew --no-daemon stageReleaseArtifacts --warning-mode all

      - name: Download packaged release clients
        if: ${{ !inputs.probe && inputs.clients-artifact != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.clients-artifact }}
          path: build/release

      - name: Package discovery probe jars
        if: ${{ inputs.probe }}
        run: ./gradlew --no-daemon :client-fabric:targets:mc1_21_11:compatProbeJar :client-fabric:targets:mc26_1:compatProbeJar :client-fabric:targets:mc26_2:compatProbeJar --warning-mode all

      - name: Record packaged client hashes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(
            build/release/svc-better-groups-fabric-1.21.11-*.jar
            build/release/svc-better-groups-fabric-26.1-*.jar
            build/release/svc-better-groups-fabric-26.2-*.jar
            client-fabric/targets/mc1_21_11/build/libs/*-compat-probe.jar
            client-fabric/targets/mc26_1/build/libs/*-compat-probe.jar
            client-fabric/targets/mc26_2/build/libs/*-compat-probe.jar
          )
          test "${#jars[@]}" -eq 3
          for jar in "${jars[@]}"; do
            sha256sum "$jar" | awk '{ print $1 }' > "$jar.sha256"
          done

      - name: Upload packaged clients
        uses: actions/upload-artifact@v6
        with:
          name: fabric-compat-clients-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/svc-better-groups-fabric-1.21.11-*.jar
            build/release/svc-better-groups-fabric-26.1-*.jar
            build/release/svc-better-groups-fabric-26.2-*.jar
            client-fabric/targets/mc1_21_11/build/libs/*-compat-probe.jar
            client-fabric/targets/mc26_1/build/libs/*-compat-probe.jar
            client-fabric/targets/mc26_2/build/libs/*-compat-probe.jar
            build/release/svc-better-groups-fabric-1.21.11-*.jar.sha256
            build/release/svc-better-groups-fabric-26.1-*.jar.sha256
            build/release/svc-better-groups-fabric-26.2-*.jar.sha256
            client-fabric/targets/mc1_21_11/build/libs/*-compat-probe.jar.sha256
            client-fabric/targets/mc26_1/build/libs/*-compat-probe.jar.sha256
            client-fabric/targets/mc26_2/build/libs/*-compat-probe.jar.sha256
          if-no-files-found: error
          retention-days: 1

  check:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    name: Fabric ${{ matrix.target }} / MC ${{ matrix.minecraft }} / Voice Chat ${{ matrix.voicechatArtifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify preinstalled Xvfb
        run: |
          command -v Xvfb
          command -v xvfb-run

      - name: Download packaged clients
        uses: actions/download-artifact@v7
        with:
          name: fabric-compat-clients-${{ github.run_id }}-${{ github.run_attempt }}
          path: packaged-clients

      - name: Resolve exact client jar
        id: client
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          if [ "$PROBE" = true ]; then
            matches=(packaged-clients/**/*"fabric-${TARGET}"*-compat-probe.jar)
          else
            matches=(packaged-clients/**/svc-better-groups-fabric-"${TARGET}"-[0-9]*.jar)
          fi
          test "${#matches[@]}" -eq 1
          jar_path=$(realpath "${matches[0]}")
          expected=$(cat "$jar_path.sha256")
          actual=$(sha256sum "$jar_path" | awk '{ print $1 }')
          test "$actual" = "$expected"
          {
            echo "path=$jar_path"
            echo "sha256=$expected"
          } >> "$GITHUB_OUTPUT"

      - name: Run packaged client compatibility test
        env:
          ALSOFT_DRIVERS: 'null'
          TARGET: ${{ matrix.target }}
          MINECRAFT: ${{ matrix.minecraft }}
          VOICECHAT_ARTIFACT: ${{ matrix.voicechatArtifact }}
          CLIENT_JAR: ${{ steps.client.outputs.path }}
          PROBE: ${{ inputs.probe }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compat-results
          args=(
            --build-cache
            :client-fabric:compat-runner:runProductionClientGameTest
            -PcompatRunnerOnly=true
            "-PcompatTarget=$TARGET"
            "-PcompatMinecraftVersion=$MINECRAFT"
            "-PcompatVoicechatArtifact=$VOICECHAT_ARTIFACT"
            "-PcompatReleaseJar=$CLIENT_JAR"
          )
          if [ "$PROBE" = true ]; then
            args+=("-PcompatProbe=true")
          fi

          result=fail
          if ./gradlew "${args[@]}"; then
            result=ok
          fi
          file="fabric__${TARGET}__${MINECRAFT}__${VOICECHAT_ARTIFACT}"
          printf '%s\n' "$result" > "compat-results/$file"
          echo "- \`$TARGET / $MINECRAFT / $VOICECHAT_ARTIFACT\`: $result" >> "$GITHUB_STEP_SUMMARY"
          test "$result" = ok

      - name: Confirm packaged client was not modified
        if: ${{ always() && steps.client.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum '${{ steps.client.outputs.path }}' | awk '{ print $1 }')
          test "$actual" = '${{ steps.client.outputs.sha256 }}'

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compat-result-fabric-${{ matrix.target }}-${{ matrix.minecraft }}-${{ matrix.voicechatArtifact }}
          path: compat-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload client logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: compat-logs-fabric-${{ matrix.target }}-${{ matrix.minecraft }}-${{ matrix.voicechatArtifact }}
          path: client-fabric/compat-runner/build/run/
          if-no-files-found: ignore
          retention-days: 7
