name: Voice Chat Compatibility

# Reusable harness shared by the PR build (tested versions) and the discovery
# workflow (new candidates). Each matrix leg compiles the client against one
# Simple Voice Chat version and then verifies the mixins actually apply by
# launching the packaged client and a separate Fabric Client GameTest mod
# through Loom's production run task. Loom owns the Xvfb wrapper used by CI.

on:
  workflow_call:
    inputs:
      versions:
        description: JSON array of Simple Voice Chat Modrinth artifact versions
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        voicechat: ${{ fromJSON(inputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Compile against ${{ matrix.voicechat }}
        run: ./gradlew --no-daemon :client-fabric:build "-PvoicechatVersion=${{ matrix.voicechat }}"

      - name: Verify mixins apply on ${{ matrix.voicechat }}
        env:
          # Headless runners do not expose a real audio output device.
          ALSOFT_DRIVERS: "null"
        run: >
          ./gradlew --no-daemon :client-fabric:runProductionClientGameTest
          "-PvoicechatVersion=${{ matrix.voicechat }}"
          -PvoicechatCompatCheck=true

      - name: Record result
        if: always()
        run: |
          mkdir -p compat-results
          if [ "${{ job.status }}" = "success" ]; then
            echo ok > "compat-results/${{ matrix.voicechat }}"
          else
            echo fail > "compat-results/${{ matrix.voicechat }}"
          fi
          echo "- \`${{ matrix.voicechat }}\`: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compat-result-${{ matrix.voicechat }}
          path: compat-results/

      - name: Upload client logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: compat-logs-${{ matrix.voicechat }}
          path: client-fabric/run/logs/
          if-no-files-found: ignore
