# Single source of truth for Simple Voice Chat client compatibility.
#
# minecraft         - Minecraft version targeted by the Fabric client module.
# voicechat.compile - minimum supported Simple Voice Chat Modrinth artifact;
#                     the client always compiles against this version.
# voicechat.range   - version range shipped in fabric.mod.json "depends".
# voicechat.tested  - comma-separated Modrinth artifacts verified by CI;
#                     extended only by the discovery workflow after a green run.
minecraft=26.2
voicechat.compile=fabric-2.6.21+26.2
voicechat.range=>=2.6.21 <2.6.23
voicechat.tested=fabric-2.6.21+26.2,fabric-2.6.22+26.2
