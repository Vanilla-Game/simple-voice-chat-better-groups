name: SVCBetterGroups
version: "${version}"
main: ru.vanillagame.voicechat.bettergroups.BetterGroupsPlugin
api-version: "26.1.2"
folia-supported: true
description: Group invites, leadership and members-only text chat for Simple Voice Chat.
website: "https://vanilla-game.ru"
depend: [voicechat]

permissions:
  vanillagame.svc_better_groups.use:
    description: Allows use of /voicegroup and group chat commands. Kick still requires current group leadership.
    default: true
