name: SimpleVoiceChatGroupManagement
version: "${version}"
main: ru.vanillagame.voicechat.groupmanagement.SvcGroupManagementPlugin
api-version: "26.2"
description: Password-free group invites and leader-authorized group kicks for Simple Voice Chat.
website: "https://vanilla-game.ru"
depend: [voicechat]

commands:
  voicegroup:
    description: Manage Simple Voice Chat group invites and members.
    usage: "/voicegroup <invite <player>|accept <token>|kick <player>|transfer <player>|request <group>>"
    aliases: [vcgroup]

permissions:
  vanillagame.svc_group_management.use:
    description: Allows use of /voicegroup. Kick still requires current group leadership.
    default: true
