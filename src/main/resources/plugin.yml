name: VoiceChatGroupTools
version: "${version}"
main: ru.vanillagame.voicechat.grouptools.VoiceChatGroupToolsPlugin
api-version: "26.2"
description: Password-free group invites and leader-authorized group kicks for Simple Voice Chat.
website: "https://vanilla-game.ru"
depend: [voicechat]

commands:
  vcgroup:
    description: Manage Simple Voice Chat group invites and members.
    usage: "/vcgroup <invite <player>|accept <token>|kick <player>|transfer <player>>"

permissions:
  vanillagame.voicechat_group_tools.use:
    description: Allows use of /vcgroup. Kick still requires current group leadership.
    default: true
